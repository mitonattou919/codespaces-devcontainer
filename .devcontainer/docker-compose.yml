services:

  code:
    build:
      context: ./code
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    container_name: claude-code-dev
    environment:
      - TZ=Asia/Tokyo
      - LANG=C.UTF-8
      - http_proxy=http://proxy:3128
      - https_proxy=http://proxy:3128
      - HTTP_PROXY=http://proxy:3128
      - HTTPS_PROXY=http://proxy:3128
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ccode-claude:/home/ccode/.claude
      - ccode-config:/home/ccode/.config
    tty: true
    stdin_open: true
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - internal

  proxy:
    build:
      context: ./proxy
    container_name: squid-proxy
    ports:
      - "3128:3128"
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/whitelist.txt:/etc/squid/whitelist.txt:ro
      - ./proxy/logs:/var/log/squid
    restart: unless-stopped
    networks:
      - internal
      - external
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - "no-new-privileges:true"

volumes:
  ccode-claude:
  ccode-config:

networks:
  internal:
    internal: true
  external:
    driver: bridge
